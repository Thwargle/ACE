[Android_OpenXR DeviceProfile]
; DAT terrain and object textures use the World sampler. Blend adjacent mip
; levels on the headset so small head movements do not snap between them.
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=linear,MipFilter=linear,MipGenSettings=TMGS_SimpleAverage)
