name: Publish Docker server (manual)

on:
  # Optional server-container publishing, separate from Windows/Quest releases.
  # Ordinary pushes and source checkouts do not need a Docker Hub account.
  workflow_dispatch:
    inputs:
      dockerhub_repository:
        description: 'Your Docker Hub repository (username/image); requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets'
        required: true
        type: string

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ inputs.dockerhub_repository }}:latest
