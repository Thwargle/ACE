; DAT world textures retain their explicit
; trilinear filtering; the v15 anisotropic experiment increased native shimmer.

[GlobalDefaults DeviceProfile]
; Project01 is reserved for VR panel render targets. Linear mip blending avoids
; shimmer, while bounded anisotropy preserves text along the less-minified axis
; when a world-pinned window is viewed at an angle. World DAT textures stay as-is.
+TextureLODGroups=(Group=TEXTUREGROUP_Project01,MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=linear,MipGenSettings=TMGS_SimpleAverage,MaxAniso=4)
